<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Agenda — Stella Orione</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #2A1545;
      --surface:   #3B1F60;
      --card:      #4A2878;
      --accent:    #C084FC;
      --accent2:   #E879F9;
      --gold:      #F4C542;
      --green:     #4ADE80;
      --red:       #F87171;
      --text:      #F5F0FF;
      --muted:     #A78BBF;
      --border:    rgba(192,132,252,0.18);
      --radius:    14px;
      --shadow:    0 4px 24px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1A0D30 0%, var(--surface) 100%);
      padding: 18px 20px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-size: 22px; line-height: 1; padding: 4px 8px 4px 0;
    }
    header h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: var(--text); }
    header .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .btn-add {
      background: var(--accent); color: #1A0D30;
      border: none; border-radius: 50%; width: 38px; height: 38px;
      font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(192,132,252,0.4); font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-add:active { transform: scale(0.93); }

    /* ── Main ── */
    main { max-width: 480px; margin: 0 auto; padding: 0 0 120px; }

    /* ── Month nav ── */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .month-nav button {
      background: var(--surface); border: 1px solid var(--border); color: var(--accent);
      width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .month-nav button:active { background: var(--card); }
    .month-label { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--text); text-align: center; }
    .year-label { font-size: 12px; color: var(--muted); text-align: center; margin-top: 1px; }

    /* ── Calendar grid ── */
    .calendar-wrap { padding: 0 14px; }
    .dow-row { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 4px; }
    .dow-row span { text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; padding: 4px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-day {
      aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; position: relative;
      transition: background 0.12s; background: transparent;
      font-size: 13px; font-weight: 500; color: var(--text);
    }
    .cal-day.empty { pointer-events: none; }
    .cal-day.other-month { color: var(--muted); opacity: 0.4; }
    .cal-day:not(.empty):hover { background: rgba(192,132,252,0.12); }
    .cal-day.today { background: rgba(192,132,252,0.18); color: var(--accent); font-weight: 700; }
    .cal-day.selected { background: var(--accent) !important; color: #1A0D30 !important; font-weight: 700; }
    .cal-day .dots { display: flex; gap: 2px; margin-top: 2px; height: 5px; align-items: center; }
    .cal-day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
    .cal-day.selected .dot { background: #1A0D30; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 16px 20px; }

    /* ── Day panel ── */
    .day-panel { padding: 0 16px; }
    .day-panel-title {
      font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 700;
      color: var(--accent); margin-bottom: 12px;
    }
    .no-appts { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }

    /* ── Appointment card ── */
    .appt-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px;
      position: relative; overflow: hidden;
      box-shadow: var(--shadow);
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
    .appt-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent);
      border-radius: 3px 0 0 3px;
    }
    .appt-card.pagato::before { background: var(--green); }
    .appt-card.non-pagato::before { background: var(--red); }
    .appt-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .appt-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge-green { background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
    .badge-red   { background: rgba(248,113,113,0.15); color: var(--red);   border: 1px solid rgba(248,113,113,0.3); }
    .badge-gold  { background: rgba(244,197,66,0.15);  color: var(--gold);  border: 1px solid rgba(244,197,66,0.3); }
    .badge-muted { background: rgba(167,139,191,0.12); color: var(--muted); border: 1px solid rgba(167,139,191,0.2); }
    .appt-amount { font-size: 16px; font-weight: 700; color: var(--gold); margin-top: 5px; }
    .appt-note { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; }
    .appt-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-sm {
      flex: 1; padding: 6px 10px; border-radius: 8px; border: none;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-sm:active { opacity: 0.75; }
    .btn-edit { background: rgba(192,132,252,0.18); color: var(--accent); }
    .btn-delete { background: rgba(248,113,113,0.15); color: var(--red); }

    /* ── Riepilogo mese ── */
    .recap { padding: 16px 16px 0; }
    .recap-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
    .recap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .recap-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; text-align: center;
    }
    .recap-card .r-val { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; line-height: 1.1; }
    .recap-card .r-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }
    .recap-card.green .r-val { color: var(--green); }
    .recap-card.gold  .r-val { color: var(--gold); }
    .recap-card.red   .r-val { color: var(--red); }
    .recap-card.purple .r-val { color: var(--accent); }

    /* ── Modal overlay ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(10,5,20,0.75);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px 22px 0 0; padding: 24px 20px 40px;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      transform: translateY(40px); transition: transform 0.25s cubic-bezier(.22,.88,.35,1);
    }
    .overlay.open .modal { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: var(--muted); border-radius: 2px; margin: 0 auto 20px; opacity: 0.4; }
    .modal h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; margin-bottom: 18px; }

    /* ── Form ── */
    .form-row { margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 5px; }
    input, textarea, select {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 14px; padding: 10px 13px; outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: none; height: 72px; }
    select option { background: var(--card); color: var(--text); }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .toggle-label { font-size: 13px; font-weight: 500; }
    .toggle {
      width: 44px; height: 24px; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer; position: relative; transition: background 0.2s;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .toggle.on::after { left: 21px; }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--accent); color: #1A0D30;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px; transition: opacity 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-submit:active { opacity: 0.8; }
    .btn-cancel-modal {
      width: 100%; padding: 12px; background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 12px; font-size: 14px;
      cursor: pointer; margin-top: 8px; font-family: 'DM Sans', sans-serif;
    }

    /* ── List view toggle ── */
    .view-tabs {
      display: flex; gap: 6px; padding: 12px 16px 0;
    }
    .view-tab {
      flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 10px;
      background: transparent; color: var(--muted); font-size: 12px; font-weight: 600;
      cursor: pointer; text-align: center; transition: all 0.15s;
      font-family: 'DM Sans', sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .view-tab.active { background: var(--accent); color: #1A0D30; border-color: var(--accent); }

    /* ── List all month ── */
    .month-list { padding: 12px 16px 0; }
    .month-list-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 11px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
      animation: fadeIn 0.18s ease;
    }
    .mli-date { text-align: center; min-width: 38px; }
    .mli-day { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; line-height: 1; color: var(--accent); }
    .mli-dow { font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.06em; }
    .mli-info { flex: 1; }
    .mli-name { font-size: 14px; font-weight: 600; }
    .mli-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .mli-amount { font-weight: 700; color: var(--gold); font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="back-btn" onclick="history.back()">‹</button>
    <div>
      <h1>Agenda</h1>
      <div class="subtitle">Stella Orione — Gestionale</div>
    </div>
  </div>
  <button class="btn-add" id="btnAdd" title="Nuovo appuntamento">+</button>
</header>

<main>
  <!-- Month nav -->
  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div>
      <div class="month-label" id="monthLabel"></div>
      <div class="year-label" id="yearLabel"></div>
    </div>
    <button id="nextMonth">›</button>
  </div>

  <!-- Calendar -->
  <div class="calendar-wrap">
    <div class="dow-row">
      <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span>
      <span>Ven</span><span>Sab</span><span>Dom</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="divider"></div>

  <!-- View tabs -->
  <div class="view-tabs">
    <button class="view-tab active" id="tabDay" onclick="switchView('day')">Giorno</button>
    <button class="view-tab" id="tabMonth" onclick="switchView('month')">Tutto il mese</button>
    <button class="view-tab" id="tabRecap" onclick="switchView('recap')">Riepilogo</button>
  </div>

  <!-- Day view -->
  <div class="day-panel" id="viewDay" style="padding-top:14px;">
    <div class="day-panel-title" id="dayTitle"></div>
    <div id="dayAppts"></div>
  </div>

  <!-- Month list view -->
  <div class="month-list" id="viewMonth" style="display:none;"></div>

  <!-- Recap view -->
  <div class="recap" id="viewRecap" style="display:none;">
    <div class="recap-title" id="recapTitle"></div>
    <div class="recap-grid">
      <div class="recap-card purple"><div class="r-val" id="rAppts">0</div><div class="r-lbl">Appuntamenti</div></div>
      <div class="recap-card gold"><div class="r-val" id="rTotale">€0</div><div class="r-lbl">Totale previsto</div></div>
      <div class="recap-card green"><div class="r-val" id="rPagato">€0</div><div class="r-lbl">Incassato</div></div>
      <div class="recap-card red"><div class="r-val" id="rDaPagare">€0</div><div class="r-lbl">Da incassare</div></div>
    </div>
    <div style="margin-top:10px;" class="recap-grid">
      <div class="recap-card gold"><div class="r-val" id="rFatturato">0</div><div class="r-lbl">Fatturate</div></div>
      <div class="recap-card muted"><div class="r-val" id="rNonFatturato">0</div><div class="r-lbl">Da fatturare</div></div>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">Nuovo appuntamento</h2>
    <div class="form-row">
      <label>Nome</label>
      <input type="text" id="fNome" placeholder="Es. Giulia" autocomplete="given-name" />
    </div>
    <div class="form-row">
      <label>Cognome</label>
      <input type="text" id="fCognome" placeholder="Es. Rossi" autocomplete="family-name" />
    </div>
    <div class="form-row-2">
      <div>
        <label>Data</label>
        <input type="date" id="fData" />
      </div>
      <div>
        <label>Ora</label>
        <input type="time" id="fOra" />
      </div>
    </div>
    <div class="form-row">
      <label>Servizio / Prestazione</label>
      <input type="text" id="fServizio" placeholder="Es. Consulenza, Visita..." />
    </div>
    <div class="form-row">
      <label>Importo (€)</label>
      <input type="number" id="fImporto" placeholder="0.00" step="0.01" min="0" inputmode="decimal" />
    </div>
    <div class="toggle-row">
      <span class="toggle-label">💰 Pagato</span>
      <div class="toggle" id="tPagato" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">🧾 Fatturato</span>
      <div class="toggle" id="tFatturato" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="form-row">
      <label>Note</label>
      <textarea id="fNote" placeholder="Eventuali note..."></textarea>
    </div>
    <button class="btn-submit" id="btnSave" onclick="saveAppt()">Salva appuntamento</button>
    <button class="btn-cancel-modal" onclick="closeModal()">Annulla</button>
  </div>
</div>

<script>
// ── State ──
const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DAYS_SHORT = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const DAYS_FULL = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];

let now = new Date();
let curYear = now.getFullYear();
let curMonth = now.getMonth();
let selDay = now.getDate();
let editId = null;
let currentView = 'day';

function storageKey(y, m) { return `so_appts_${y}_${m}`; }
function loadAppts(y, m) {
  try { return JSON.parse(localStorage.getItem(storageKey(y, m)) || '[]'); } catch { return []; }
}
function saveAppts(y, m, arr) {
  localStorage.setItem(storageKey(y, m), JSON.stringify(arr));
}

// ── Calendar ──
function renderCalendar() {
  document.getElementById('monthLabel').textContent = MONTHS[curMonth];
  document.getElementById('yearLabel').textContent = curYear;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(curYear, curMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
  const daysInPrev = new Date(curYear, curMonth, 0).getDate();
  // Monday-first: convert Sunday(0) → 6, Mon(1)→0 etc
  const offset = (firstDay === 0) ? 6 : firstDay - 1;

  const appts = loadAppts(curYear, curMonth);
  const apptsByDay = {};
  appts.forEach(a => {
    const d = new Date(a.data).getUTCDate();
    apptsByDay[d] = (apptsByDay[d] || 0) + 1;
  });

  // Prev month days
  for (let i = 0; i < offset; i++) {
    const d = daysInPrev - offset + 1 + i;
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = d;
    grid.appendChild(el);
  }

  // Current month days
  const todayD = now.getDate(), todayM = now.getMonth(), todayY = now.getFullYear();
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div');
    el.className = 'cal-day';
    if (d === todayD && curMonth === todayM && curYear === todayY) el.classList.add('today');
    if (d === selDay) el.classList.add('selected');
    el.innerHTML = `<span>${d}</span>`;
    if (apptsByDay[d]) {
      const dots = document.createElement('div');
      dots.className = 'dots';
      const n = Math.min(apptsByDay[d], 3);
      for (let i = 0; i < n; i++) dots.innerHTML += '<div class="dot"></div>';
      el.appendChild(dots);
    }
    const dayNum = d;
    el.addEventListener('click', () => selectDay(dayNum));
    grid.appendChild(el);
  }

  // Next month filler
  const total = offset + daysInMonth;
  const remainder = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remainder; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = i;
    grid.appendChild(el);
  }
}

function selectDay(d) {
  selDay = d;
  renderCalendar();
  renderDayView();
  if (currentView !== 'day') switchView('day');
}

// ── Day view ──
function renderDayView() {
  const appts = loadAppts(curYear, curMonth).filter(a => {
    return new Date(a.data).getUTCDate() === selDay;
  }).sort((a,b) => a.ora.localeCompare(b.ora));

  const dow = new Date(curYear, curMonth, selDay).getDay();
  const dowName = DAYS_FULL[(dow === 0 ? 6 : dow - 1)];
  document.getElementById('dayTitle').textContent = `${dowName}, ${selDay} ${MONTHS[curMonth]}`;

  const el = document.getElementById('dayAppts');
  el.innerHTML = '';
  if (!appts.length) { el.innerHTML = '<div class="no-appts">Nessun appuntamento</div>'; return; }
  appts.forEach(a => el.appendChild(buildCard(a)));
}

function buildCard(a) {
  const div = document.createElement('div');
  div.className = `appt-card ${a.pagato ? 'pagato' : 'non-pagato'}`;
  const pagBadge = a.pagato
    ? '<span class="badge badge-green">✓ Pagato</span>'
    : '<span class="badge badge-red">✗ Da pagare</span>';
  const fatBadge = a.fatturato
    ? '<span class="badge badge-gold">🧾 Fatturato</span>'
    : '<span class="badge badge-muted">Da fatturare</span>';
  const oraPart = a.ora ? `<span>🕐 ${a.ora}</span> ·` : '';
  const servPart = a.servizio ? `<span>${a.servizio}</span>` : '';
  div.innerHTML = `
    <div class="appt-name">${a.nome} ${a.cognome}</div>
    <div class="appt-meta">${oraPart} ${servPart}</div>
    <div class="appt-meta" style="margin-top:5px;">${pagBadge} ${fatBadge}</div>
    ${a.importo ? `<div class="appt-amount">€ ${parseFloat(a.importo).toFixed(2)}</div>` : ''}
    ${a.note ? `<div class="appt-note">${a.note}</div>` : ''}
    <div class="appt-actions">
      <button class="btn-sm btn-edit" onclick="editAppt('${a.id}')">✏️ Modifica</button>
      <button class="btn-sm btn-delete" onclick="deleteAppt('${a.id}')">🗑 Elimina</button>
    </div>
  `;
  return div;
}

// ── Month list view ──
function renderMonthList() {
  const appts = loadAppts(curYear, curMonth).sort((a,b) => {
    if (a.data !== b.data) return a.data.localeCompare(b.data);
    return a.ora.localeCompare(b.ora);
  });
  const el = document.getElementById('viewMonth');
  el.innerHTML = '';
  if (!appts.length) { el.innerHTML = '<div class="no-appts" style="padding:20px 0;">Nessun appuntamento questo mese</div>'; return; }
  appts.forEach(a => {
    const d = new Date(a.data).getUTCDate();
    const dow = new Date(a.data).getUTCDay();
    const dowName = DAYS_SHORT[(dow === 0 ? 6 : dow - 1)];
    const item = document.createElement('div');
    item.className = 'month-list-item';
    item.innerHTML = `
      <div class="mli-date"><div class="mli-day">${d}</div><div class="mli-dow">${dowName}</div></div>
      <div class="mli-info">
        <div class="mli-name">${a.nome} ${a.cognome}</div>
        <div class="mli-sub">${a.ora ? a.ora + ' · ' : ''}${a.servizio || ''}${a.pagato ? ' · ✓' : ' · ✗'}</div>
      </div>
      ${a.importo ? `<div class="mli-amount">€${parseFloat(a.importo).toFixed(0)}</div>` : ''}
    `;
    item.addEventListener('click', () => { selectDay(d); });
    el.appendChild(item);
  });
}

// ── Recap ──
function renderRecap() {
  const appts = loadAppts(curYear, curMonth);
  let totale = 0, pagato = 0, daPagare = 0, fatt = 0, nonFatt = 0;
  appts.forEach(a => {
    const imp = parseFloat(a.importo) || 0;
    totale += imp;
    if (a.pagato) pagato += imp; else daPagare += imp;
    if (a.fatturato) fatt++; else nonFatt++;
  });
  document.getElementById('recapTitle').textContent = `${MONTHS[curMonth]} ${curYear}`;
  document.getElementById('rAppts').textContent = appts.length;
  document.getElementById('rTotale').textContent = `€${totale.toFixed(0)}`;
  document.getElementById('rPagato').textContent = `€${pagato.toFixed(0)}`;
  document.getElementById('rDaPagare').textContent = `€${daPagare.toFixed(0)}`;
  document.getElementById('rFatturato').textContent = fatt;
  document.getElementById('rNonFatturato').textContent = nonFatt;
}

// ── View switch ──
function switchView(v) {
  currentView = v;
  document.getElementById('viewDay').style.display   = v === 'day'   ? 'block' : 'none';
  document.getElementById('viewMonth').style.display = v === 'month' ? 'block' : 'none';
  document.getElementById('viewRecap').style.display = v === 'recap' ? 'block' : 'none';
  document.getElementById('tabDay').classList.toggle('active', v === 'day');
  document.getElementById('tabMonth').classList.toggle('active', v === 'month');
  document.getElementById('tabRecap').classList.toggle('active', v === 'recap');
  if (v === 'day') renderDayView();
  if (v === 'month') renderMonthList();
  if (v === 'recap') renderRecap();
}

// ── Modal ──
function openModal(prefillDate) {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Nuovo appuntamento';
  document.getElementById('fNome').value = '';
  document.getElementById('fCognome').value = '';
  const d = prefillDate || `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
  document.getElementById('fData').value = d;
  document.getElementById('fOra').value = '';
  document.getElementById('fServizio').value = '';
  document.getElementById('fImporto').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('tPagato').classList.remove('on');
  document.getElementById('tFatturato').classList.remove('on');
  document.getElementById('overlay').classList.add('open');
}

function editAppt(id) {
  const allAppts = loadAppts(curYear, curMonth);
  const a = allAppts.find(x => x.id === id);
  if (!a) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Modifica appuntamento';
  document.getElementById('fNome').value = a.nome;
  document.getElementById('fCognome').value = a.cognome;
  document.getElementById('fData').value = a.data;
  document.getElementById('fOra').value = a.ora || '';
  document.getElementById('fServizio').value = a.servizio || '';
  document.getElementById('fImporto').value = a.importo || '';
  document.getElementById('fNote').value = a.note || '';
  document.getElementById('tPagato').classList.toggle('on', !!a.pagato);
  document.getElementById('tFatturato').classList.toggle('on', !!a.fatturato);
  document.getElementById('overlay').classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }

function toggleSwitch(el) { el.classList.toggle('on'); }

function saveAppt() {
  const nome = document.getElementById('fNome').value.trim();
  const cognome = document.getElementById('fCognome').value.trim();
  const data = document.getElementById('fData').value;
  if (!nome || !cognome || !data) { alert('Nome, cognome e data sono obbligatori.'); return; }

  const dateObj = new Date(data);
  const y = dateObj.getUTCFullYear();
  const m = dateObj.getUTCMonth();

  const appt = {
    id: editId || `${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
    nome, cognome, data,
    ora:       document.getElementById('fOra').value,
    servizio:  document.getElementById('fServizio').value.trim(),
    importo:   document.getElementById('fImporto').value,
    pagato:    document.getElementById('tPagato').classList.contains('on'),
    fatturato: document.getElementById('tFatturato').classList.contains('on'),
    note:      document.getElementById('fNote').value.trim()
  };

  let arr = loadAppts(y, m);
  if (editId) { arr = arr.map(x => x.id === editId ? appt : x); }
  else { arr.push(appt); }
  saveAppts(y, m, arr);

  // If we moved to a different month in edit, also remove from old list
  if (editId && (y !== curYear || m !== curMonth)) {
    let oldArr = loadAppts(curYear, curMonth).filter(x => x.id !== editId);
    saveAppts(curYear, curMonth, oldArr);
  }

  closeModal();
  renderCalendar();
  selDay = dateObj.getUTCDate();
  if (y === curYear && m === curMonth) {
    renderDayView();
    switchView('day');
  } else {
    curYear = y; curMonth = m; selDay = dateObj.getUTCDate();
    renderCalendar(); renderDayView(); switchView('day');
  }
}

function deleteAppt(id) {
  if (!confirm('Eliminare questo appuntamento?')) return;
  const arr = loadAppts(curYear, curMonth).filter(x => x.id !== id);
  saveAppts(curYear, curMonth, arr);
  renderCalendar(); renderDayView();
}

// ── Month navigation ──
document.getElementById('prevMonth').addEventListener('click', () => {
  curMonth--; if (curMonth < 0) { curMonth = 11; curYear--; }
  selDay = 1; renderCalendar(); switchView(currentView);
});
document.getElementById('nextMonth').addEventListener('click', () => {
  curMonth++; if (curMonth > 11) { curMonth = 0; curYear++; }
  selDay = 1; renderCalendar(); switchView(currentView);
});

document.getElementById('btnAdd').addEventListener('click', () => openModal());

// Close overlay on backdrop click
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

// ── Init ──
renderCalendar();
renderDayView();
</script>
</body>
</html>
